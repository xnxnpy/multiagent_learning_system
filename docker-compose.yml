# ============================================
# 智学优培 — 一键部署
#   docker compose up -d --build
# 访问: http://localhost:8080
# ============================================
name: ai-learning

services:
  mysql:
    image: mysql:8.0
    container_name: ai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ai_root_2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_learning}
      MYSQL_CHARSET: utf8mb4
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=256M
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-ai_root_2024}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: ai-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 可选：知识图谱（不启用时应用降级 MySQL JSON）
  # 启用: docker compose --profile neo4j up -d
  neo4j:
    image: neo4j:5-community
    container_name: ai-neo4j
    restart: unless-stopped
    profiles: ["neo4j"]
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-ai_neo4j_2024}
      NEO4J_server_memory_heap_max__size: 512M
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"
      - "7687:7687"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 覆盖 .env 中的 localhost，指向 compose 内服务
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_learning}
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ai_root_2024}
      MYSQL_USER: root
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      DEBUG: "False"
      # 未启用 neo4j profile 时留空/保持默认即可（图谱降级）
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-ai_neo4j_2024}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./prompts:/app/prompts
      - chroma_data:/app/data/chroma
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  chroma_data:
  neo4j_data:
